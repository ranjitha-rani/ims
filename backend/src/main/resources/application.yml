spring:
  application:
    name: ims-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ims}
    username: ${DATABASE_USER:ims}
    password: ${DATABASE_PASSWORD:ims}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL:false}
      connect-timeout: 500ms
      timeout: 500ms
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:ims-platform}
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.ims.platform
    producer:
      properties:
        enable.idempotence: true
        acks: all
management:
  health:
    redis:
      enabled: ${REDIS_ENABLED:true}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
server:
  port: ${PORT:8080}
  shutdown: graceful
ims:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap-admin:
    email: ${IMS_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${IMS_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${IMS_BOOTSTRAP_ADMIN_NAME:IMS Administrator}
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  kafka:
    enabled: ${KAFKA_ENABLED:true}
  outbox:
    enabled: ${OUTBOX_ENABLED:true}
  redis:
    enabled: ${REDIS_ENABLED:true}
  demo:
    enabled: ${IMS_DEMO_ENABLED:false}
    customer-password: ${IMS_DEMO_CUSTOMER_PASSWORD:CustomerDemo12!}
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
