name: ims-oci

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - private

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 0.40
    security_opt:
      - no-new-privileges:true

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 0.15
    security_opt:
      - no-new-privileges:true

  api:
    <<: *service-defaults
    build:
      context: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_SSL: "false"
      REDIS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_GROUP_ID: ims-platform
      KAFKA_ENABLED: "false"
      OUTBOX_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P30D}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      IMS_BOOTSTRAP_ADMIN_EMAIL: ${IMS_BOOTSTRAP_ADMIN_EMAIL:-}
      IMS_BOOTSTRAP_ADMIN_PASSWORD: ${IMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      IMS_BOOTSTRAP_ADMIN_NAME: ${IMS_BOOTSTRAP_ADMIN_NAME:-IMS Administrator}
      IMS_DEMO_ENABLED: ${IMS_DEMO_ENABLED:-true}
      IMS_DEMO_CUSTOMER_PASSWORD: ${IMS_DEMO_CUSTOMER_PASSWORD:-CustomerDemo12!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q '200' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 3g
    cpus: 0.60
    security_opt:
      - no-new-privileges:true

  caddy:
    <<: *service-defaults
    image: caddy:2-alpine
    networks:
      - private
      - edge
    environment:
      SSLIP_HOSTNAME: ${SSLIP_HOSTNAME:?set SSLIP_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/oci/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DATA_ROOT:?set DATA_ROOT}/caddy/data:/data
      - ${DATA_ROOT:?set DATA_ROOT}/caddy/config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    cpus: 0.10
    security_opt:
      - no-new-privileges:true

  postgres-backup:
    <<: *service-defaults
    build:
      context: ./infra/oci/backup
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      OCI_BACKUP_URI: ${OCI_BACKUP_URI:-}
      OCI_NAMESPACE: ${OCI_NAMESPACE:-}
      OCI_CLI_AUTH: ${OCI_CLI_AUTH:-instance_principal}
    command: ["/scripts/backup-loop.sh"]
    volumes:
      - ./infra/oci/scripts:/scripts:ro
      - ${DATA_ROOT:?set DATA_ROOT}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.05
    security_opt:
      - no-new-privileges:true

  redpanda:
    <<: *service-defaults
    profiles: [eventing]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT}/redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q Healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1280m
    cpus: 0.30
    security_opt:
      - no-new-privileges:true

  postgres-exporter:
    <<: *service-defaults
    profiles: [observability]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.05
    security_opt:
      - no-new-privileges:true

  prometheus:
    <<: *service-defaults
    profiles: [observability]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.oci.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_ROOT:?set DATA_ROOT}/prometheus:/prometheus
    depends_on:
      - postgres-exporter
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 768m
    cpus: 0.20
    security_opt:
      - no-new-privileges:true

  grafana:
    <<: *service-defaults
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${SSLIP_HOSTNAME:?set SSLIP_HOSTNAME}/admin/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${DATA_ROOT:?set DATA_ROOT}/grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.10
    security_opt:
      - no-new-privileges:true

networks:
  private:
    driver: bridge
    internal: true
  edge:
    driver: bridge
